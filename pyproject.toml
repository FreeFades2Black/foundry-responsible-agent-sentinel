[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-responsible-agent-sentinel"
version = "1.0.0"
description = "Audited Retrieval & Secure Action Agent in Microsoft Azure AI Foundry with Defense-in-Depth RAG and Guardrails"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "William Free Hall", email = "whall4.wh@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Security :: Defensive",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "src"
]
markers = [
    "adversarial: Adversarial red-team evaluation suite testing jailbreaks and indirect prompt injections",
    "unit: Standard unit tests for guardrails, spotlighting, and tool validation",
]
