name: Deploy Azure Infrastructure & Foundry Model via Terraform

on:
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy-azure-infrastructure.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - development
          - staging
          - production
      auto_apply:
        description: "Automatically apply the Terraform plan (true/false)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan-and-deploy:
    name: Terraform Plan & Deploy Azure Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Verify Terraform Formatting
        run: |
          terraform fmt -check -recursive terraform/

      - name: Azure Login via Passwordless OIDC Workload Identity
        uses: azure/login@v2
        if: ${{ env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Initialize Terraform Blueprint
        run: |
          cd terraform
          terraform init -backend=false

      - name: Validate Terraform Configuration & Schemas
        run: |
          cd terraform
          terraform validate

      - name: Plan Azure Infrastructure & Foundry Models
        run: |
          cd terraform
          terraform plan -var="environment_name=sentinel" -out=tfplan

      - name: Apply Azure Setup (When Auto-Apply Enabled)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.auto_apply == 'true' }}
        run: |
          cd terraform
          terraform apply -auto-approve tfplan
