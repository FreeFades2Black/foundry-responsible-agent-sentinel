name: Responsible AI Adversarial Evaluation Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  rai-eval-gate:
    name: Adversarial Red-Team, Safety & Terraform Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"

      - name: Verify Terraform Formatting & Configuration
        run: |
          terraform fmt -check terraform/

      - name: Install Dependencies & Evaluation Toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Bicep & Infrastructure Integrity
        run: |
          # Verify Bicep CLI syntax if available
          which az && az bicep build --file infra/main.bicep || echo "Az CLI Bicep build skipped in test container"

      - name: Run Red-Team Adversarial Benchmark & Terraform Compliance Gate
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID || 'ci-mock-sub-001' }}
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-ci-sentinel' }}
          AZURE_PROJECT_NAME: ${{ secrets.AZURE_PROJECT_NAME || 'ci-sentinel-rai-project' }}
          EVAL_MODEL_DEPLOYMENT: "gpt-4o"
        run: |
          python -m pytest tests/ -v --tb=short
